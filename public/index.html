<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>翻訳</title>
    <meta name="description" content="DeepL API でテキストを翻訳します。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
            <rect width="28" height="28" rx="8" fill="#0f2b46" />
            <text x="14" y="19" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">訳</text>
          </svg>
          <span>翻訳</span>
        </a>
        <button type="button" class="key-btn" id="apiKeyBtn">APIキー</button>
      </div>
    </header>

    <div class="modes">
      <div class="modes-inner">
        <span class="mode is-active">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M4.2 4.5h7.2a3.2 3.2 0 0 1 0 6.4H7.1V15H4.2V4.5Zm2.9 2.1v2.2h3.9a1.1 1.1 0 0 0 0-2.2H7.1Z"
              fill="currentColor"
            />
            <path
              d="M12.6 11.2c.2-1.4 1.3-2.4 2.8-2.4 1.6 0 2.7 1.1 2.7 2.7S17 14.2 15.4 14.2c-.7 0-1.3-.2-1.8-.7l.9-1.5.4.3c.2.1.4.2.6.2.6 0 1-.5 1-1.2s-.4-1.1-1-1.1c-.5 0-.9.3-1 .9h-1.9Z"
              fill="currentColor"
            />
          </svg>
          テキストの翻訳
        </span>
      </div>
    </div>

    <main class="page">
      <section class="translator" aria-label="テキスト翻訳">
        <div class="lang-strip">
          <div class="lang-slot">
            <button
              type="button"
              class="lang-btn"
              id="sourceLangBtn"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="langMenu"
            >
              <span id="sourceLangLabel">言語を自動検出</span>
              <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.2 6.2 8 10l3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </button>
          </div>
          <button
            type="button"
            class="swap-btn"
            id="swapBtn"
            disabled
            aria-label="原文と訳文の言語を入れ替えます"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M4 7.2h9.2M11.2 4.4 14.2 7.2 11.2 10"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M16 12.8H6.8M8.8 10l-3 2.8 3 2.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <div class="lang-slot is-end">
            <button
              type="button"
              class="lang-btn"
              id="targetLangBtn"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="langMenu"
            >
              <span id="targetLangLabel">日本語</span>
              <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.2 6.2 8 10l3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>

        <div class="panes">
          <section class="pane" aria-label="原文">
            <div class="pane-body">
              <label class="sr-only" for="sourceText">原文</label>
              <textarea
                id="sourceText"
                placeholder="翻訳するにはテキストを入力してください。"
                spellcheck="true"
              ></textarea>
              <button type="button" class="clear-btn" id="clearBtn" hidden aria-label="原文を消去">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M4 4l8 8M12 4 4 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
              </button>
            </div>
            <div class="pane-tools">
              <span class="char-count" id="charCount" aria-live="polite"></span>
              <button type="button" class="icon-btn" id="copySourceBtn" disabled aria-label="原文をコピー">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <rect x="7" y="6.2" width="8.2" height="9.2" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5" />
                  <path d="M5.2 12.6V5.4A1.6 1.6 0 0 1 6.8 3.8h6.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </button>
            </div>
          </section>

          <section class="pane" aria-label="訳文">
            <div class="pane-body">
              <div class="output" id="output" role="status" aria-live="polite"></div>
            </div>
            <div class="pane-tools">
              <span class="status" id="status"></span>
              <button type="button" class="icon-btn" id="copyTargetBtn" disabled aria-label="訳文をコピー">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <rect x="7" y="6.2" width="8.2" height="9.2" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5" />
                  <path d="M5.2 12.6V5.4A1.6 1.6 0 0 1 6.8 3.8h6.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </button>
            </div>
          </section>
        </div>
      </section>
      <p class="footnote">翻訳には DeepL API を使用しています。APIキーは右上のボタンから入力でき、このブラウザに保存されます。</p>
    </main>

    <div class="lang-menu" id="langMenu" hidden role="dialog" aria-label="言語を選択">
      <div class="lang-search">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="9" cy="9" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M13.2 13.2 16.5 16.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input id="langSearch" type="search" placeholder="言語を検索します" autocomplete="off" />
      </div>
      <div class="lang-list" id="langList" role="listbox"></div>
    </div>

    <div class="modal-backdrop" id="apiKeyDialog" hidden>
      <form class="modal" id="apiKeyForm" role="dialog" aria-modal="true" aria-labelledby="apiKeyTitle">
        <h2 id="apiKeyTitle">APIキー</h2>
        <p>DeepLのAPIキーを入力します。このブラウザに保存し、翻訳するときだけ送信します。</p>
        <label for="apiKeyInput">DeepL APIキー</label>
        <div class="key-field">
          <input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx:fx" />
          <button type="button" class="btn-ghost" id="apiKeyToggle">表示</button>
        </div>
        <p class="field-error" id="apiKeyError" hidden></p>
        <p class="hint">無料プランのキーは :fx で終わります。空のまま保存すると削除します。</p>
        <div class="modal-actions">
          <button type="button" class="btn-text" id="apiKeyClear" hidden>削除</button>
          <span class="modal-spacer"></span>
          <button type="button" class="btn-ghost" id="apiKeyCancel">キャンセル</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
